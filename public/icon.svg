<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#125928" />
      <stop offset="80%" stop-color="#0a3818" />
      <stop offset="100%" stop-color="#041a0b" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background felt table -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="url(#goldBorder)" stroke-width="4" opacity="0.6" />

  <!-- Center Card Emblem -->
  <g filter="url(#cardShadow)">
    <!-- Back card tilted left -->
    <rect x="130" y="90" width="180" height="260" rx="18" fill="#ffffff" transform="rotate(-12 220 220)" stroke="#e2e8f0" stroke-width="3" />
    <text x="210" y="240" fill="#dc2626" font-size="70" font-family="serif" text-anchor="middle" transform="rotate(-12 220 220)">♥</text>

    <!-- Front card tilted right -->
    <rect x="200" y="90" width="180" height="260" rx="18" fill="#ffffff" transform="rotate(8 290 220)" stroke="#e2e8f0" stroke-width="3" />
    <text x="280" y="240" fill="#0f172a" font-size="70" font-family="serif" text-anchor="middle" transform="rotate(8 290 220)">♠</text>
  </g>

  <!-- Big Gold 28 Badge -->
  <g transform="translate(256, 370)">
    <circle r="72" fill="#0b1b11" stroke="url(#goldBorder)" stroke-width="6" />
    <text x="0" y="16" fill="#fef08a" font-size="52" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">28</text>
    <text x="0" y="44" fill="#fbbf24" font-size="16" font-family="sans-serif" font-weight="700" text-anchor="middle" letter-spacing="3">MASTER</text>
  </g>
</svg>
