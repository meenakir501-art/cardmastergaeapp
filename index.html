    <script>
      /* Ensure window.fetch has a setter for browser extensions and interceptors */
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            }
          });
        } catch (e) {
          /* ignore if environment strictly forbids defineProperty */
        }

        /* Silence uncaught errors originating from browser extensions */
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && event.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
          ) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.message &&
            event.reason.message.indexOf('Cannot set property fetch of #<Window>') !== -1
          ) {
            event.preventDefault();
            return false;
          }
        });
      })();
    </script>
